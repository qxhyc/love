
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可以成为我的小狗吗？</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; /* 浪漫的粉色背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* 防止按钮跑出去出现滚动条 */
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 10;
        }

        /* 图片样式 */
        #main-img {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* 按钮容器 */
        .btn-group {
            position: relative;
            height: 60px; /* 预留高度 */
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 10px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #yes-btn {
            background-color: #ff4081;
            color: white;
        }

        #yes-btn:hover {
            background-color: #f50057;
            transform: scale(1.1);
        }

        #no-btn {
            background-color: #e0e0e0;
            color: #333;
            position: relative; /* 初始相对定位，方便后续变绝对定位 */
        }

        /* 飘落爱心动画 */
        .heart {
            position: fixed;
            top: -10%;
            color: #ff4081;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* 移动端适配微调 */
        @media (max-width: 600px) {
            .container {
                width: 85%;
                padding: 20px;
            }
            #main-img {
                width: 150px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

    // --- DOM 元素获取 ---
    const mainImg = document.getElementById('main-img');
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const question = document.getElementById('question');

    // --- “不要”按钮的逃跑逻辑 ---
    function moveButton() {
        // 切换成哭泣图片
        mainImg.src = imgCry;

        // 获取窗口宽高
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        // 获取按钮宽高
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        // 计算随机位置 (保留一点边距防止溢出)
        const newX = Math.random() * (windowWidth - btnWidth - 40) + 20;
        const newY = Math.random() * (windowHeight - btnHeight - 40) + 20;

        // 设置为绝对定位并移动
        noBtn.style.position = 'fixed';
        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
    }

    // 电脑端：鼠标移入就跑
    noBtn.addEventListener('mouseover', moveButton);
    // 手机端：点击的时候跑 (因为手机没有hover)
    noBtn.addEventListener('click', (e) => {
        e.preventDefault(); // 阻止默认点击
        moveButton();
    });

    // --- “可以”按钮的同意逻辑 ---
    yesBtn.addEventListener('click', () => {
        // 切换成开心图片
        mainImg.src = imgHappy;

        // 修改文字
        question.innerText = "真乖！❤️";

        // 隐藏按钮
        document.querySelector('.btn-group').style.display = 'none';

        // 开始撒花特效
        createHearts();
    });

    // --- 撒爱心特效函数 ---
    function createHearts() {
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️'; // 可以是emoji，也可以是SVG

            // 随机位置和大小
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';

            // 随机动画时长
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';

            document.body.appendChild(heart);

            // 动画结束后移除元素，防止页面卡顿
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }, 300);
    }
</script>
